version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    groups:
      npm-patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bun"
    directory: "/agent"
    schedule:
      interval: "weekly"
    cooldown:
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    ignore:
      # Shared deps flow from root via scripts/dep-sync.ts (root package.json is
      # the source of truth); a per-package bump fails the bun run deps:check guard.
      - dependency-name: "dockerode"
      - dependency-name: "jose"
      - dependency-name: "zod"
      - dependency-name: "@types/dockerode"
      - dependency-name: "@types/bun"
      - dependency-name: "typescript"
    groups:
      agent-npm-patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bun"
    directory: "/agent-updater"
    schedule:
      interval: "weekly"
    cooldown:
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    ignore:
      - dependency-name: "dockerode"
      - dependency-name: "jose"
      - dependency-name: "zod"
      - dependency-name: "@types/dockerode"
      - dependency-name: "@types/bun"
      - dependency-name: "typescript"
    groups:
      agent-updater-npm-patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # Bumps must include .bun-version, which dependabot cannot edit; the
      # guard test fails an oven/bun-only bump, so these are made manually.
      - dependency-name: "oven/bun"
    groups:
      root-docker-patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/agent"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "oven/bun"
    groups:
      agent-docker-patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/agent-updater"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "oven/bun"
    groups:
      agent-updater-docker-patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
