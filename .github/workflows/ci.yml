name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]

# One run per ref: a newer push cancels the in-progress run for the same branch or
# PR, so rapid merges to main (e.g. a batch of Dependabot PRs) don't each run CI to
# completion. Keyed on github.ref so distinct PRs stay independent and release-tag
# builds (refs/tags/v*) are never canceled by a main push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, Test & License Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect dependency changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            dependencies:
              - 'package.json'
              - 'bun.lock'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Run tests with coverage check
        run: bun run test
        env:
          NODE_ENV: test

      - name: Check licenses
        if: github.event_name == 'push' || steps.changes.outputs.dependencies == 'true'
        run: |
          bunx license-checker-rseidelsohn \
            --onlyAllow "MIT;ISC;BSD-3-Clause;BSD-2-Clause;Apache-2.0;MIT-0;Unlicense;MPL-2.0;OFL-1.1;Python-2.0;CC-BY-4.0;BlueOak-1.0.0;CC0-1.0;0BSD" \
            --summary

      - name: Generate license report
        if: github.event_name == 'push' || steps.changes.outputs.dependencies == 'true'
        run: |
          bunx license-checker-rseidelsohn --json > license-report.json
          bunx license-checker-rseidelsohn --summary

      - name: Upload license report
        if: github.event_name == 'push' || steps.changes.outputs.dependencies == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: license-report
          path: license-report.json
          retention-days: 30

  agent:
    name: Agent Test & License Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect dependency changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            dependencies:
              - 'agent/package.json'
              - 'bun.lock'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd agent && bun install --frozen-lockfile

      - name: Typecheck
        run: cd agent && bun run typecheck

      - name: Run tests with coverage check
        run: cd agent && bun run test:coverage
        env:
          NODE_ENV: test

      - name: Check licenses
        if: github.event_name == 'push' || steps.changes.outputs.dependencies == 'true'
        run: |
          cd agent && bunx license-checker-rseidelsohn \
            --excludePrivatePackages \
            --onlyAllow "MIT;ISC;BSD-3-Clause;BSD-2-Clause;Apache-2.0;MIT-0;Unlicense;MPL-2.0;OFL-1.1;Python-2.0;CC-BY-4.0;BlueOak-1.0.0;CC0-1.0;0BSD" \
            --summary

      - name: Generate license report
        if: github.event_name == 'push' || steps.changes.outputs.dependencies == 'true'
        run: |
          cd agent
          bunx license-checker-rseidelsohn --json > license-report.json
          bunx license-checker-rseidelsohn --summary

      - name: Upload license report
        if: github.event_name == 'push' || steps.changes.outputs.dependencies == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: agent-license-report
          path: agent/license-report.json
          retention-days: 30

  agent-updater:
    name: Agent Updater Test & License Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect dependency changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            dependencies:
              - 'agent-updater/package.json'
              - 'agent-updater/bun.lock'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd agent-updater && bun install --frozen-lockfile

      - name: Typecheck
        run: cd agent-updater && bun run typecheck

      - name: Run tests with coverage check
        run: cd agent-updater && bun run test:coverage
        env:
          NODE_ENV: test

      - name: Check licenses
        if: github.event_name == 'push' || steps.changes.outputs.dependencies == 'true'
        run: |
          cd agent-updater && bunx license-checker-rseidelsohn \
            --excludePrivatePackages \
            --onlyAllow "MIT;ISC;BSD-3-Clause;BSD-2-Clause;Apache-2.0;MIT-0;Unlicense;MPL-2.0;OFL-1.1;Python-2.0;CC-BY-4.0;BlueOak-1.0.0;CC0-1.0;0BSD" \
            --summary

      - name: Generate license report
        if: github.event_name == 'push' || steps.changes.outputs.dependencies == 'true'
        run: |
          cd agent-updater
          bunx license-checker-rseidelsohn --json > license-report.json
          bunx license-checker-rseidelsohn --summary

      - name: Upload license report
        if: github.event_name == 'push' || steps.changes.outputs.dependencies == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: agent-updater-license-report
          path: agent-updater/license-report.json
          retention-days: 30

  demo-build:
    name: Demo Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build demo
        run: bun run build:demo

  migrations:
    name: Migration Verification
    runs-on: ubuntu-latest

    # Pinned by digest: a floating tag (latest-pg16) lets an upstream image push
    # break main with no commit in this repo. This digest is what latest-pg16
    # resolved to when the job was added; bump both together.
    services:
      timescaledb:
        image: timescale/timescaledb:2.28.3-pg16@sha256:61f891691050da6032023c01ea885730eeeba06b7c17b403e7d0b9c49c37dfe9
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check out the merge base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "No usable base commit, comparing HEAD against itself"
            BASE_SHA="$(git rev-parse HEAD)"
          fi
          MERGE_BASE="$(git merge-base "$BASE_SHA" HEAD || echo "$BASE_SHA")"
          echo "Merge base: $MERGE_BASE"
          git worktree add --detach "$RUNNER_TEMP/migrations-base" "$MERGE_BASE"
          echo "root=$RUNNER_TEMP/migrations-base" >> "$GITHUB_OUTPUT"

      - name: Fresh install
        run: bun scripts/migration-verify/run.ts fresh

      - name: Upgrade with existing data
        run: bun scripts/migration-verify/run.ts upgrade
        env:
          MIGRATION_BASE_ROOT: ${{ steps.base.outputs.root }}

      - name: Re-run idempotency
        run: bun scripts/migration-verify/run.ts idempotent

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [build-test, agent, agent-updater]
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: [build-test, agent, agent-updater]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata for web image
        id: meta-web
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/jaredglaser/homelab-manager-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for worker image
        id: meta-worker
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/jaredglaser/homelab-manager-worker
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for agent image
        id: meta-agent
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/jaredglaser/homelab-manager-agent
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for agent-updater image
        id: meta-agent-updater
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/jaredglaser/homelab-manager-agent-updater
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: base
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push agent image
        uses: docker/build-push-action@v7
        with:
          context: ./agent
          target: base
          push: true
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

      - name: Build and push agent-updater image
        uses: docker/build-push-action@v7
        with:
          context: ./agent-updater
          push: true
          tags: ${{ steps.meta-agent-updater.outputs.tags }}
          labels: ${{ steps.meta-agent-updater.outputs.labels }}
          cache-from: type=gha,scope=agent-updater
          cache-to: type=gha,mode=max,scope=agent-updater

  deploy-demo:
    name: Deploy Demo to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build-test, agent, agent-updater, demo-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build demo
        run: bun run build:demo
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Rename _shell.html to index.html and copy to 404.html for SPA routing
        run: |
          mv .output/public/_shell.html .output/public/index.html
          cp .output/public/index.html .output/public/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
