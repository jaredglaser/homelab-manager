name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  # No branches filter: a mid-stack PR targets its parent PR's branch, not main, and a
  # filter here silently gives it zero check runs instead of a failure anyone can see.
  pull_request:

# One run per ref: a newer push cancels the in-progress run for the same branch or
# PR, so rapid merges to main (e.g. a batch of Dependabot PRs) don't each run CI to
# completion. Keyed on github.ref so distinct PRs stay independent and release-tag
# builds (refs/tags/v*) are never canceled by a main push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build, Test & License Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # paths-filter calls pulls.listFiles on pull_request events

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect dependency changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: changes
        with:
          filters: |
            dependencies:
              - 'package.json'
              - 'bun.lock'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Run tests with coverage check
        run: bun run test
        env:
          NODE_ENV: test

      - name: Check licenses
        if: github.event_name == 'push' || steps.changes.outputs.dependencies == 'true'
        run: |
          bunx license-checker-rseidelsohn \
            --onlyAllow "MIT;ISC;BSD-3-Clause;BSD-2-Clause;Apache-2.0;MIT-0;Unlicense;MPL-2.0;OFL-1.1;Python-2.0;CC-BY-4.0;BlueOak-1.0.0;CC0-1.0;0BSD" \
            --summary

      - name: Generate license report
        if: github.event_name == 'push' || steps.changes.outputs.dependencies == 'true'
        run: |
          bunx license-checker-rseidelsohn --json > license-report.json
          bunx license-checker-rseidelsohn --summary

      - name: Upload license report
        if: github.event_name == 'push' || steps.changes.outputs.dependencies == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: license-report
          path: license-report.json
          retention-days: 30

  e2e:
    name: E2E (Playwright + MSW)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run e2e tests
        run: bun run test:e2e
        env:
          CI: '1'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  agent:
    name: Agent Test & License Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # paths-filter calls pulls.listFiles on pull_request events

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect dependency changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: changes
        with:
          filters: |
            dependencies:
              - 'agent/package.json'
              - 'bun.lock'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Install dependencies
        run: cd agent && bun install --frozen-lockfile

      - name: Typecheck
        run: cd agent && bun run typecheck

      - name: Run tests with coverage check
        run: cd agent && bun run test:coverage
        env:
          NODE_ENV: test

      - name: Check licenses
        if: github.event_name == 'push' || steps.changes.outputs.dependencies == 'true'
        run: |
          cd agent && bunx license-checker-rseidelsohn \
            --excludePrivatePackages \
            --onlyAllow "MIT;ISC;BSD-3-Clause;BSD-2-Clause;Apache-2.0;MIT-0;Unlicense;MPL-2.0;OFL-1.1;Python-2.0;CC-BY-4.0;BlueOak-1.0.0;CC0-1.0;0BSD" \
            --summary

      - name: Generate license report
        if: github.event_name == 'push' || steps.changes.outputs.dependencies == 'true'
        run: |
          cd agent
          bunx license-checker-rseidelsohn --json > license-report.json
          bunx license-checker-rseidelsohn --summary

      - name: Upload license report
        if: github.event_name == 'push' || steps.changes.outputs.dependencies == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-license-report
          path: agent/license-report.json
          retention-days: 30

  agent-updater:
    name: Agent Updater Test & License Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # paths-filter calls pulls.listFiles on pull_request events

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect dependency changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: changes
        with:
          filters: |
            dependencies:
              - 'agent-updater/package.json'
              - 'agent-updater/bun.lock'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Install dependencies
        run: cd agent-updater && bun install --frozen-lockfile

      - name: Typecheck
        run: cd agent-updater && bun run typecheck

      - name: Run tests with coverage check
        run: cd agent-updater && bun run test:coverage
        env:
          NODE_ENV: test

      - name: Check licenses
        if: github.event_name == 'push' || steps.changes.outputs.dependencies == 'true'
        run: |
          cd agent-updater && bunx license-checker-rseidelsohn \
            --excludePrivatePackages \
            --onlyAllow "MIT;ISC;BSD-3-Clause;BSD-2-Clause;Apache-2.0;MIT-0;Unlicense;MPL-2.0;OFL-1.1;Python-2.0;CC-BY-4.0;BlueOak-1.0.0;CC0-1.0;0BSD" \
            --summary

      - name: Generate license report
        if: github.event_name == 'push' || steps.changes.outputs.dependencies == 'true'
        run: |
          cd agent-updater
          bunx license-checker-rseidelsohn --json > license-report.json
          bunx license-checker-rseidelsohn --summary

      - name: Upload license report
        if: github.event_name == 'push' || steps.changes.outputs.dependencies == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-updater-license-report
          path: agent-updater/license-report.json
          retention-days: 30

  demo-build:
    name: Demo Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build demo
        run: bun run build:demo

  migrations:
    name: Migration Verification
    runs-on: ubuntu-latest

    # Pinned by digest: a floating tag (latest-pg16) lets an upstream image push
    # break main with no commit in this repo. This digest is what latest-pg16
    # resolved to when the job was added; bump both together.
    services:
      timescaledb:
        image: timescale/timescaledb:2.28.3-pg16@sha256:61f891691050da6032023c01ea885730eeeba06b7c17b403e7d0b9c49c37dfe9
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check out the merge base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
          fi
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "No usable base commit, comparing HEAD against itself"
            BASE_SHA="$(git rev-parse HEAD)"
          fi
          MERGE_BASE="$(git merge-base "$BASE_SHA" HEAD || echo "$BASE_SHA")"
          echo "Merge base: $MERGE_BASE"
          git worktree add --detach "$RUNNER_TEMP/migrations-base" "$MERGE_BASE"
          echo "root=$RUNNER_TEMP/migrations-base" >> "$GITHUB_OUTPUT"

      - name: Fresh install
        run: bun scripts/migration-verify/run.ts fresh

      - name: Upgrade with existing data
        run: bun scripts/migration-verify/run.ts upgrade
        env:
          MIGRATION_BASE_ROOT: ${{ steps.base.outputs.root }}

      - name: Re-run idempotency
        run: bun scripts/migration-verify/run.ts idempotent

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [build-test, agent, agent-updater]
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: [build-test, agent, agent-updater, e2e, migrations]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Extract metadata for web image
        id: meta-web
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/jaredglaser/homelab-manager-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for worker image
        id: meta-worker
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/jaredglaser/homelab-manager-worker
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for agent image
        id: meta-agent
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/jaredglaser/homelab-manager-agent
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for agent-updater image
        id: meta-agent-updater
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/jaredglaser/homelab-manager-agent-updater
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: base
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push agent image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./agent
          target: base
          push: true
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

      - name: Build and push agent-updater image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./agent-updater
          push: true
          tags: ${{ steps.meta-agent-updater.outputs.tags }}
          labels: ${{ steps.meta-agent-updater.outputs.labels }}
          cache-from: type=gha,scope=agent-updater
          cache-to: type=gha,mode=max,scope=agent-updater

  deploy-demo:
    name: Deploy Demo to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build-test, agent, agent-updater, demo-build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build demo
        run: bun run build:demo
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Rename _shell.html to index.html and copy to 404.html for SPA routing
        run: |
          mv .output/public/_shell.html .output/public/index.html
          cp .output/public/index.html .output/public/404.html

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
