name: PR Ready

# Every trigger here runs main's copy of this file and the script. A `pull_request`
# trigger would run the PR's own copy, which could then mark itself Ready.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: [CI, PR Version Impact]
    types: [requested, completed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number (leave empty for every open PR)
        required: false

concurrency:
  group: pr-ready-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha || inputs.pr || github.event_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  ready:
    name: Work out Ready
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: read

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
          bun-version-file: .bun-version

      - name: Write the Ready check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          case "$EVENT_NAME" in
            pull_request_target) bun scripts/pr-ready.ts --publish "$PR_NUMBER" ;;
            workflow_run) bun scripts/pr-ready.ts --publish "--head-sha=$HEAD_SHA" ;;
            workflow_dispatch) bun scripts/pr-ready.ts --publish ${INPUT_PR:+"$INPUT_PR"} ;;
            *) bun scripts/pr-ready.ts --publish ;;
          esac
