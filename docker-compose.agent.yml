# Standalone agent stack for running the agent from this checkout.
# The deployable per-host stack is generated by the Add Host wizard from
# src/lib/templates/agent-stack-compose.ts and pins released images instead of
# building from source (see self-hosting/README.md, "Image tags").
#
# The agent runs on per-agent JWT auth: it refuses to start without
# AGENT_TRUSTED_PUBKEY or AGENT_TRUSTED_PUBKEY_FILE and AGENT_HOST_NAME (the
# AGENT_TOKEN_FILE bearer token went away with the OpenBao migration). This
# stack reads the dev public JWK that the dev seeder writes to
# data/dev-agent-pubkey.json (HOMELAB_DEV_SEED=true in docker-compose.local.yml),
# so start that stack once first, or point AGENT_TRUSTED_PUBKEY_FILE at your own
# JWK file. AGENT_HOST_NAME must match the managed host name the dashboard
# knows (the seeded dev host is "localhost").
services:
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: hlm-socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      EVENTS: 1
      INFO: 1
      IMAGES: 1
      ALLOW_LOGS: 1
      NETWORKS: 1
      VOLUMES: 1
      VERSION: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      POST: 1
      EXEC: 1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2375/version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - agent-internal
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    environment:
      DOCKER_HOST: "tcp://socket-proxy:2375"
      AGENT_PORT: "9090"
      STACKS_DIR: "/opt/homelab-manager/stacks"
      AGENT_TRUSTED_PUBKEY_FILE: "/etc/hlm/dev-agent-pubkey.json"
      AGENT_HOST_NAME: "${AGENT_HOST_NAME:-localhost}"
    ports:
      - "127.0.0.1:9090:9090"
    container_name: hlm-agent
    restart: unless-stopped
    volumes:
      - ./data:/etc/hlm:ro
      - agent-stacks-local:/opt/homelab-manager/stacks
    networks:
      - agent-internal
      - homelab-network
    depends_on:
      socket-proxy:
        condition: service_healthy
    labels:
      - hlm.managed=true
      - hlm.role=agent
networks:
  agent-internal:
    driver: bridge
    internal: true
  homelab-network:
    driver: bridge
volumes:
  agent-stacks-local:
