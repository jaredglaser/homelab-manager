# homelab-manager agent stack
# Generated by homelab-manager UI
services:
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: hlm-socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      EVENTS: 1
      INFO: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      VERSION: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      EXEC: 1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2375/version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - agent-internal
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    environment:
      DOCKER_HOST: "tcp://socket-proxy:2375"
      AGENT_TOKEN_FILE: /run/secrets/agent_token
      AGENT_PORT: "9090"
      STACKS_DIR: "/opt/homelab-manager/stacks"
    ports:
      - "127.0.0.1:9090:9090"
    container_name: hlm-agent
    restart: unless-stopped
    volumes:
      - ./agent-token:/run/secrets/agent_token:ro
    networks:
      - agent-internal
      - homelab-network
    depends_on:
      socket-proxy:
        condition: service_healthy
    labels:
      - hlm.managed=true
      - hlm.role=agent
networks:
  agent-internal:
    driver: bridge
    internal: true
  homelab-network:
    driver: bridge