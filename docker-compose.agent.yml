# Docker management feature services (use with DOCKER_MANAGEMENT_FEATURE_FLAG=true)
# Usage: docker compose -f docker-compose.local.yml -f docker-compose.agent.yml up
services:
  socket-proxy:
    # Pin to a date-based tag when available; :latest used here for dev convenience
    image: lscr.io/linuxserver/socket-proxy:latest
    environment:
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1
      - AUTH=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - CONTAINERS=1
      - DISABLE_IPV6=0
      - DISTRIBUTION=0
      - EVENTS=1
      - EXEC=0
      - IMAGES=1
      - INFO=1
      - LOG_LEVEL=info
      - NETWORKS=1
      - NODES=0
      - PING=1
      - PLUGINS=0
      - POST=1
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - TZ=America/New_York
      - VERSION=1
      - VOLUMES=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
    networks:
      - homelab-network

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    environment:
      DOCKER_HOST: "tcp://socket-proxy:2375"
      AGENT_TOKEN: "${AGENT_TOKEN:-dev-agent-token}"
      AGENT_PORT: "9090"
      STACKS_DIR: "/opt/homelab-manager/stacks"
    ports:
      - "9090:9090"
    volumes:
      - homelab-stacks:/opt/homelab-manager/stacks
      - ./agent/src:/app/src  # Hot reload in dev
    depends_on:
      - socket-proxy
    networks:
      - homelab-network

  openbao:
    image: openbao/openbao
    command: server -dev
    environment:
      BAO_DEV_ROOT_TOKEN_ID: "${BAO_DEV_ROOT_TOKEN_ID:-dev-root-token}"
    ports:
      - "8200:8200"
    networks:
      - homelab-network

volumes:
  homelab-stacks:
