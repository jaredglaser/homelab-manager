# Docker Compose configuration for hybrid local development
# This runs only postgres + worker in Docker, while web app runs locally with `bun dev`
#
# Usage:
#   bun run dev:local:up    # Start postgres + worker
#   bun dev                 # Run web app locally (separate terminal)
#   bun run dev:local:down  # Stop services

x-postgres-env: &postgres-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_SSL: "false"

x-zfs-env: &zfs-env
  ZFS_HOST_1: ${ZFS_HOST_1:-}
  ZFS_HOST_PORT_1: ${ZFS_HOST_PORT_1:-22}
  ZFS_HOST_NAME_1: ${ZFS_HOST_NAME_1:-}
  ZFS_HOST_USER_1: ${ZFS_HOST_USER_1:-}
  ZFS_HOST_PASSWORD_1: ${ZFS_HOST_PASSWORD_1:-}
  ZFS_HOST_KEY_PATH_1: ${ZFS_HOST_KEY_PATH_1:-}
  ZFS_HOST_KEY_PASSPHRASE_1: ${ZFS_HOST_KEY_PASSPHRASE_1:-}
  ZFS_HOST_2: ${ZFS_HOST_2:-}
  ZFS_HOST_PORT_2: ${ZFS_HOST_PORT_2:-22}
  ZFS_HOST_NAME_2: ${ZFS_HOST_NAME_2:-}
  ZFS_HOST_USER_2: ${ZFS_HOST_USER_2:-}
  ZFS_HOST_PASSWORD_2: ${ZFS_HOST_PASSWORD_2:-}
  ZFS_HOST_KEY_PATH_2: ${ZFS_HOST_KEY_PATH_2:-}
  ZFS_HOST_KEY_PASSPHRASE_2: ${ZFS_HOST_KEY_PASSPHRASE_2:-}
  ZFS_HOST_3: ${ZFS_HOST_3:-}
  ZFS_HOST_PORT_3: ${ZFS_HOST_PORT_3:-22}
  ZFS_HOST_NAME_3: ${ZFS_HOST_NAME_3:-}
  ZFS_HOST_USER_3: ${ZFS_HOST_USER_3:-}
  ZFS_HOST_PASSWORD_3: ${ZFS_HOST_PASSWORD_3:-}
  ZFS_HOST_KEY_PATH_3: ${ZFS_HOST_KEY_PATH_3:-}
  ZFS_HOST_KEY_PASSPHRASE_3: ${ZFS_HOST_KEY_PASSPHRASE_3:-}

x-proxmox-env: &proxmox-env
  PROXMOX_HOST: ${PROXMOX_HOST:-}
  PROXMOX_PORT: ${PROXMOX_PORT:-8006}
  PROXMOX_TOKEN_ID: ${PROXMOX_TOKEN_ID:-}
  PROXMOX_TOKEN_SECRET: ${PROXMOX_TOKEN_SECRET:-}
  PROXMOX_ALLOW_SELF_SIGNED: ${PROXMOX_ALLOW_SELF_SIGNED:-true}

x-worker-dev: &worker-dev
  build:
    context: .
    dockerfile: Dockerfile
    target: deps
  volumes:
    - .:/app
    - node_modules:/app/node_modules
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  networks:
    - homelab-network
  depends_on:
    postgres:
      condition: service_healthy

services:
  # PostgreSQL database
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: homelab-db-local
    mem_limit: 256m
    command: postgres -c synchronous_commit=off
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - pgdata-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - homelab-network

  # Background worker (collects stats and persists to DB)
  worker:
    <<: *worker-dev
    container_name: homelab-worker-local
    mem_limit: 512m
    command: bun src/worker/collector.ts
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - ./data:/app/data
    environment:
      <<: [*postgres-env, *zfs-env, *proxmox-env]
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE}
      WORKER_ENABLED: ${WORKER_ENABLED}
      WORKER_DOCKER_ENABLED: ${WORKER_DOCKER_ENABLED}
      WORKER_ZFS_ENABLED: ${WORKER_ZFS_ENABLED}
      WORKER_PROXMOX_ENABLED: ${WORKER_PROXMOX_ENABLED}
      WORKER_COLLECTION_INTERVAL_MS: ${WORKER_COLLECTION_INTERVAL_MS}
      DEV_HOST_NAME: ${DEV_HOST_NAME:-}
      WORKER_LOCALHOST_AGENT: "hlm-agent"
      HOMELAB_DEV_SEED: "true"
      MASTER_KEY: ${MASTER_KEY:?Set MASTER_KEY in .env (openssl rand -base64 32)}

  # Socket proxy for secure Docker socket access (management profile)
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: hlm-socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      EVENTS: 1
      INFO: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      VERSION: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      EXEC: 1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2375/version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - agent-internal
    profiles:
      - management

  # Agent sidecar for Docker management (management profile)
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: hlm-agent
    restart: unless-stopped
    environment:
      DOCKER_HOST: "tcp://socket-proxy:2375"
      AGENT_PORT: "9090"
      STACKS_DIR: "/opt/homelab-manager/stacks"
      AGENT_TRUSTED_PUBKEY_FILE: "/etc/hlm/dev-agent-pubkey.json"
    volumes:
      - agent-stacks-local:/opt/homelab-manager/stacks
      - ./data:/etc/hlm:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - agent-internal
      - homelab-network
    depends_on:
      socket-proxy:
        condition: service_healthy
    labels:
      - hlm.managed=true
      - hlm.role=agent
    profiles:
      - management

volumes:
  node_modules:
  pgdata-local:
  agent-stacks-local:

networks:
  homelab-network:
    driver: bridge
  agent-internal:
    driver: bridge
    internal: true
